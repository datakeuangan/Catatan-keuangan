<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Catatan Keuangan</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #121212;
    }
    /* Trik Clipping: Menggeser iframe ke atas -38px untuk menyembunyikan banner Google Apps Script */
    .app-wrapper {
      position: absolute;
      top: -38px;
      left: 0;
      width: 100%;
      height: calc(100% + 38px);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="app-wrapper">
    <!-- GANTI LINK DI BAWAH DENGAN LINK WEB APP GOOGLE APPS SCRIPT ANDA -->
    <iframe src="https://script.google.com/macros/s/AKfycbxrXYMNhHOtmynAu9rzgV21LDL1e7amuNugleH1KVKn0me-XpDAGBGQcu7wQWW2_NuAZg/exec" allow="autoplay; encrypted-media"></iframe>
  </div>
</body>
</html>
