<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#121212">
  <title>Catatan Keuangan</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #121212;
    }

    #appFrame {
      display: block;
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      border: 0;
      outline: 0;
      background: #121212;
    }

    @supports not (height: 100dvh) {
      #appFrame {
        height: 100vh;
      }
    }
  </style>
</head>

<body>
  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbwm-WLwVmNoPk2E0AxTqqNu2QiyYTBgbm-BX9NHoa55Yaf9Zvbap_Y9sLaqxgFBIH5kRA/exec?embedded=true"
    title="Catatan Keuangan"
    frameborder="0"
    scrolling="auto"
    allow="clipboard-read; clipboard-write"
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>
</body>
</html>
