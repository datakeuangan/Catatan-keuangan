<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#121212">
  <title>Catatan Keuangan</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-width: 0;
      height: 100%;
      min-height: 100%;
      overflow: hidden;
      background: #121212;
    }

    body {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }

    #appFrame {
      display: block;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      margin: 0;
      padding: 0;
      border: 0;
      outline: 0;
      background: #121212;
    }

    @supports not (height: 100dvh) {
      body,
      #appFrame {
        height: 100vh;
      }
    }
  </style>
</head>

<body>
  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbz5HJgUKmTYYhEDUXWgUsnWneSDTe8gH5w4nSFZMII_wRSTodECMxrONSL4j5uqITolwmw/exec"
    title="Catatan Keuangan"
    frameborder="0"
    scrolling="auto"
    allow="clipboard-read; clipboard-write"
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>
</body>
</html>
