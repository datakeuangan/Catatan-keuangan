<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#121212">
  <title>Catatan Keuangan</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 100%;
      overflow: hidden;
      background: #121212;
    }

    body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }

    /*
      Google Apps Script menampilkan banner informasi di bagian paling atas.
      Karena iframe berasal dari domain Google, JavaScript/CSS dari GitHub
      tidak boleh mengakses isi iframe. Solusi yang aman adalah memotong
      bagian atas iframe secara visual.
    */
    #frameWindow {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #121212;
    }

    #appFrame {
      position: absolute;
      left: 0;
      top: -48px;
      display: block;
      width: 100%;
      height: calc(100% + 48px);
      min-width: 0;
      min-height: 0;
      margin: 0;
      padding: 0;
      border: 0;
      outline: 0;
      background: #121212;
    }

    @media (max-width: 600px) {
      #appFrame {
        top: -48px;
        height: calc(100% + 48px);
      }
    }

    @supports not (height: 100dvh) {
      html,
      body,
      #frameWindow {
        height: 100vh;
      }
    }
  </style>
</head>

<body>
  <div id="frameWindow">
    <iframe
      id="appFrame"
      src="https://script.google.com/macros/s/AKfycbz5HJgUKmTYYhEDUXWgUsnWneSDTe8gH5w4nSFZMII_wRSTodECMxrONSL4j5uqIToWmw/exec"
      title="Catatan Keuangan"
      frameborder="0"
      scrolling="auto"
      allow="clipboard-read; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
  </div>
</body>
</html>
