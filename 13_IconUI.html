function setCustomIcon(value, context) {
      var val = sanitizeIcon(value);
      if (!val) return;

      var mapVar = {
        main: 'selectedMainIcon', sub: 'selectedSubIcon', edit: 'selectedEditIcon',
        rek: 'selectedRekIcon', rekEdit: 'selectedRekIconEdit', goal: 'selectedGoalIcon'
      };
      var mapGrid = {
        main: 'iconGridMain', sub: 'iconGridSub', edit: 'iconGridEdit',
        rek: 'iconGridRek', rekEdit: 'iconGridRekEdit', goal: 'iconGridGoal'
      };
      var mapPreview = {
        main: 'previewMain', sub: 'previewSub', edit: 'previewEdit',
        rek: 'previewRek', rekEdit: 'previewRekEdit', goal: 'previewGoal'
      };

      window[mapVar[context]] = val;
      document.getElementById(mapPreview[context]).innerText = val;
      if (context === 'goal') document.getElementById('goalIcon').value = val;
      document.getElementById(mapGrid[context]).querySelectorAll('.icon-opt').forEach(function(el) {
        el.classList.remove('selected');
      });
    }

function buildIconGrids() {
      var gridConfigs = [
        { gridId: 'iconGridMain', varName: 'selectedMainIcon', previewId: 'previewMain' },
        { gridId: 'iconGridSub', varName: 'selectedSubIcon', previewId: 'previewSub' },
        { gridId: 'iconGridEdit', varName: 'selectedEditIcon', previewId: 'previewEdit' },
        { gridId: 'iconGridRek', varName: 'selectedRekIcon', previewId: 'previewRek' },
        { gridId: 'iconGridRekEdit', varName: 'selectedRekIconEdit', previewId: 'previewRekEdit' },
        { gridId: 'iconGridGoal', varName: 'selectedGoalIcon', previewId: 'previewGoal' }
      ];

      gridConfigs.forEach(function(cfg) {
        var grid = document.getElementById(cfg.gridId);
        if (!grid) return;
        grid.innerHTML = '';
        availableIcons.forEach(function(ic, idx) {
          var cleanIc = sanitizeIcon(ic);
          var div = document.createElement('div');
          div.className = 'icon-opt' + (idx === 0 && cfg.gridId !== 'iconGridRekEdit' ? ' selected' : '');
          div.innerText = cleanIc;
          div.onclick = function() {
            grid.querySelectorAll('.icon-opt').forEach(el => el.classList.remove('selected'));
            div.classList.add('selected');
            window[cfg.varName] = cleanIc;
            var previewEl = document.getElementById(cfg.previewId);
            if (previewEl) previewEl.innerText = cleanIc;
            if (cfg.gridId === 'iconGridGoal') document.getElementById('goalIcon').value = cleanIc;
            var customInputMap = {
              previewMain: 'customIconMain', previewSub: 'customIconSub', previewEdit: 'customIconEdit',
              previewRek: 'customIconRek', previewRekEdit: 'customIconRekEdit', previewGoal: 'customIconGoal'
            };
            var customInputId = customInputMap[cfg.previewId];
            if (customInputId) document.getElementById(customInputId).value = '';
          };
          grid.appendChild(div);
        });
      });
    }
